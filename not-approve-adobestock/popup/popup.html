<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adobe Stock Rejected Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div>
          <h1>Rejected Assets Downloader</h1>
          <p class="subtitle">Adobe Stock Contributor</p>
        </div>
      </div>
      <span class="badge" id="status-badge">Idle</span>
    </header>

    <!-- Page Alert if not on Adobe Stock Rejected tab -->
    <div class="alert-box" id="page-alert" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div>
        <span>Buka tab <strong>Not Accepted</strong> di Adobe Stock untuk mulai.</span>
        <a href="https://contributor.stock.adobe.com/en/uploads/rejected" target="_blank" class="alert-link">Buka Halaman &rarr;</a>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Terkumpul</span>
        <div class="stat-num" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <span class="stat-label">Halaman Saat Ini</span>
        <div class="stat-num" id="stat-page">0 / 0</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-header">
        <span id="progress-status">Siap mengambil</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="actions-row">
      <button class="btn btn-primary" id="btn-start">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span>Mulai Ambil</span>
      </button>
      <button class="btn btn-warning" id="btn-pause" style="display: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        <span>Jeda</span>
      </button>
      <button class="btn btn-danger" id="btn-stop" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"></rect></svg>
        <span>Stop</span>
      </button>
    </div>

    <!-- Download Options -->
    <div class="export-section">
      <h3 class="section-title">Unduh & Ekspor Hasil</h3>
      <div class="export-buttons">
        <button class="btn btn-success btn-full" id="btn-download-txt">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>Unduh TXT (Hanya Nama File)</span>
        </button>
        <button class="btn btn-outline" id="btn-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span>Salin Nama</span>
        </button>
        <button class="btn btn-outline" id="btn-download-csv">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="8 17 12 21 16 17"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path></svg>
          <span>Unduh CSV</span>
        </button>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="popup-toast">✓ Pesan notifikasi</div>

    <!-- Footer -->
    <footer class="popup-footer">
      <button class="btn-text" id="btn-clear-all">Reset Data</button>
      <span class="version-text">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
